// Android library (AAR) for the native side of the MOSIP Android Registration Client:
//   cd liveness-android && ./gradlew assembleRelease   ->  build/outputs/aar/liveness-android-release.aar
// Sources, dependencies and bundled models come from liveness-library.gradle, which the Flutter plugin
// (liveness-flutter/android) applies as well. The plain-Java parts are also compiled and unit-tested by
// build.sh / build.ps1 and Maven, without the Android SDK.
plugins {
    id 'com.android.library' version '9.1.0'
}

android {
    namespace = 'io.mosip.registration.liveness.android'
    compileSdk = 36

    defaultConfig {
        // The engine and signed model packages use java.nio.file, available from Android 8.0 (API 26).
        minSdk = 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // src/test runs on the JVM in build.sh; Android unit tests are not used.
    sourceSets {
        test {
            java.srcDirs = []
        }
    }
}

apply from: 'liveness-library.gradle'

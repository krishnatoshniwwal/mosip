name: mosip_face_liveness
description: "Face liveness and presentation attack detection for the MOSIP Android Registration Client."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.mosip.registration.mosip_face_liveness
        pluginClass: MosipFaceLivenessPlugin

# Face liveness / PAD configuration for the Registration Client.
#
# Every key can be set globally (mosip.registration.liveness.<key>) and overridden per workflow
# (mosip.registration.liveness.<resident|operator|supervisor>.<key>). Unknown keys are rejected at
# startup, so a typo cannot silently weaken the policy. These values are read locally and therefore
# apply identically online and offline; in the Registration Client they would be delivered through
# the synced global/machine configuration.

# ---- Global ---------------------------------------------------------------------------------
mosip.registration.liveness.enabled=true

# Camera permission: the person must explicitly allow camera use before the device is opened. Without a
# granted answer no older than maxAgeMs, the session ends with CONSENT_DECLINED and the camera stays off.
mosip.registration.liveness.consent.required=true
mosip.registration.liveness.consent.maxAgeMs=300000

# Passive liveness: aggregate this many usable frames, then compare the score (0-100) to the threshold.
mosip.registration.liveness.passive.threshold=70
mosip.registration.liveness.passive.minFrames=8
mosip.registration.liveness.passive.timeoutMs=10000
mosip.registration.liveness.face.minQuality=40

# Presentation Attack Detection: frames flagged as an attack (within one attempt) before rejecting it.
mosip.registration.liveness.pad.enabled=true
mosip.registration.liveness.pad.minAttackFrames=2

# Active liveness: used when the passive score is below the threshold (or always, if active.always=true).
mosip.registration.liveness.active.enabled=true
mosip.registration.liveness.active.always=false
mosip.registration.liveness.active.challenges=BLINK,SMILE,TURN_LEFT,TURN_RIGHT
mosip.registration.liveness.active.minChallenges=2
mosip.registration.liveness.active.maxChallenges=3
mosip.registration.liveness.active.challengeTimeoutMs=7000
mosip.registration.liveness.active.minLivenessScore=40
mosip.registration.liveness.active.headYawDegrees=20
mosip.registration.liveness.active.headPitchDegrees=15

# Retries after the first failed attempt (total attempts = retry.max + 1), and what happens after.
# BLOCK | REQUIRE_SUPERVISOR_OVERRIDE | ALLOW_ALTERNATE_AUTH
mosip.registration.liveness.retry.max=2
mosip.registration.liveness.retry.exhaustedAction=BLOCK

mosip.registration.liveness.capture.holdStillMs=700

# Capture binding: the client stores the MDS rCapture (and matches operators on a fresh capture), not a liveness
# frame. While that capture runs the stream stays open, and the verified person must stay in view, alone, bona fide
# and within maxFaceShift (fraction of the frame) of where liveness was verified; otherwise the capture is discarded.
mosip.registration.liveness.capture.bind.enabled=true
mosip.registration.liveness.capture.bind.timeoutMs=20000
mosip.registration.liveness.capture.bind.maxFaceShift=0.25

# Capture oval (normalised to the unmirrored device frame). Only a face inside it counts towards liveness or
# is captured; the capture screen draws this same oval. Tolerance is a fraction of the radii; fill is face
# width as a fraction of oval width (below minFill: "move closer", above maxFill: "move back").
mosip.registration.liveness.capture.area.enabled=true
mosip.registration.liveness.capture.area.centerX=0.5
mosip.registration.liveness.capture.area.centerY=0.48
mosip.registration.liveness.capture.area.radiusX=0.22
mosip.registration.liveness.capture.area.radiusY=0.37
mosip.registration.liveness.capture.area.centerTolerance=0.45
mosip.registration.liveness.capture.area.minFill=0.4
mosip.registration.liveness.capture.area.maxFill=1.15

# Covered faces (mask, scarf, sunglasses): ask to uncover; after graceMs fall back to active challenges that
# do not need the covered region. allowCapture=false means the final image itself must be uncovered.
mosip.registration.liveness.occlusion.enabled=true
mosip.registration.liveness.occlusion.graceMs=3000
mosip.registration.liveness.occlusion.allowCapture=false

# Lock face verification after maxFailures failed attempts within windowMs (across sessions), for lockoutMs.
# Counted per workflow and subject key (operator/supervisor user ID, registration ID, or the station).
mosip.registration.liveness.rateLimit.enabled=true
mosip.registration.liveness.rateLimit.maxFailures=5
mosip.registration.liveness.rateLimit.windowMs=600000
mosip.registration.liveness.rateLimit.lockoutMs=900000

# ---- Resident registration ----------------------------------------------------------------
# A resident who cannot pass goes to the supervisor-approved exception flow instead of being turned away.
mosip.registration.liveness.resident.retry.exhaustedAction=REQUIRE_SUPERVISOR_OVERRIDE
# Residents are counted per registration ID (or station-wide), so allow a little more before locking.
mosip.registration.liveness.resident.rateLimit.maxFailures=8

# ---- Operator login -----------------------------------------------------------------------
mosip.registration.liveness.operator.retry.exhaustedAction=ALLOW_ALTERNATE_AUTH
# Login only matches the face; a covered face may be used once liveness was proven with active challenges.
mosip.registration.liveness.operator.occlusion.allowCapture=true

# ---- Supervisor authentication ------------------------------------------------------------
# Supervisors approve other people's work, so always demand an active challenge and a higher score.
mosip.registration.liveness.supervisor.passive.threshold=80
mosip.registration.liveness.supervisor.active.always=true
mosip.registration.liveness.supervisor.active.challenges=BLINK,SMILE,TURN_LEFT,TURN_RIGHT,LOOK_UP,LOOK_DOWN
mosip.registration.liveness.supervisor.retry.max=1
mosip.registration.liveness.supervisor.retry.exhaustedAction=BLOCK
mosip.registration.liveness.supervisor.rateLimit.maxFailures=3
